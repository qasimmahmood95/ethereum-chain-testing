name: ci

# Every branch push, so defect/* runs stay visible (CLAUDE.md).
on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    # Budget is well under 5 minutes (docs/PLAN.md); fail fast, never
    # stall to GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          # Pinned: failures must reproduce byte for byte (CLAUDE.md rule 4).
          version: v1.4.1
      - run: anvil --version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Fork-lane cache: Anvil memoizes fork RPC responses per pinned
      # block, so with the secret set only the first run hits the RPC.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.foundry/cache
          # Keep in sync with FORK_BLOCK in test/fork-usdc.test.ts.
          key: fork-rpc-21000000
      # FORK_RPC_URL is optional: absent, the fork suite skips and CI
      # never touches a live RPC (ADR-0004). Scoped to main so defect/*
      # branches stay pure-local — an RPC outage must never redden a
      # defect run for the wrong reason.
      - run: npm test
        env:
          FORK_RPC_URL: ${{ github.ref == 'refs/heads/main' && secrets.FORK_RPC_URL || '' }}

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
